name: REPARADO V69 · Circuito completo de 4 roles sin datos reales
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/full-role-flow-v69.py'
      - 'supabase/auditoria-sesiones-v69.sql'
      - 'docs/VALIDACION-ROLES-V69.md'
      - '.github/workflows/qa-full-role-flow-v69.yml'
  push:
    branches: [main]
    paths:
      - 'tests/full-role-flow-v69.py'
      - 'supabase/auditoria-sesiones-v69.sql'
      - 'docs/VALIDACION-ROLES-V69.md'
      - '.github/workflows/qa-full-role-flow-v69.yml'
permissions:
  contents: read
jobs:
  four-role-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Inicializar perfiles RLS y permisos en base efimera
        run: python -u tests/supabase-roles-rls.py
      - name: Circuito integral y prueba de rollback
        run: python -u tests/full-role-flow-v69.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
