name: REPARADO V34 · Presupuesto aceptado protegido
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migration-v34.sql'
      - 'connected.js'
      - 'tests/quote-consent-v34.py'
      - 'tests/quote-consent-v34.test.mjs'
      - '.github/workflows/qa-quote-consent-v34.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migration-v34.sql'
      - 'connected.js'
      - 'tests/quote-consent-v34.py'
      - 'tests/quote-consent-v34.test.mjs'
      - '.github/workflows/qa-quote-consent-v34.yml'
permissions:
  contents: read
jobs:
  security-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - run: python -u tests/supabase-roles-rls.py
      - run: python -u tests/quote-consent-v34.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
