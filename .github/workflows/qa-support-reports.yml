name: REPARADO · Incidencias privadas de clientes
on:
  pull_request:
    branches: [main]
    paths:
      - 'connected.js'
      - 'vivid-theme.css'
      - 'supabase/migration-support-reports.sql'
      - 'supabase/functions/reparado-mail-worker/**'
      - 'tests/issue-reports.test.mjs'
      - 'tests/support-reports-rls.py'
      - '.github/workflows/qa-support-reports.yml'
  push:
    branches: [main]
    paths:
      - 'connected.js'
      - 'vivid-theme.css'
      - 'supabase/migration-support-reports.sql'
      - 'supabase/functions/reparado-mail-worker/**'
      - 'tests/issue-reports.test.mjs'
      - 'tests/support-reports-rls.py'
      - '.github/workflows/qa-support-reports.yml'
permissions:
  contents: read
jobs:
  app-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check supabase/functions/reparado-mail-worker/index.ts
  support-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - run: python -u tests/supabase-roles-rls.py
      - run: python -u tests/support-reports-rls.py
