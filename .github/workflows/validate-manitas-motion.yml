name: Validar animaciones iguales a Manitas
on:
  push:
    branches: [fix/animacion-suave-igual-manitas-20261021]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar paquetes
        run: npm install --no-audit --no-fund
      - name: Pruebas del catálogo
        run: npm test
      - name: Compilar web
        run: npm run build
      - name: Preparar navegadores
        run: npx playwright install --with-deps chromium webkit
      - name: Comprobar animación iPhone, Safari, Android y tablet
        run: npm run test:visual
      - name: Conservar resultados para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparacion-con-manitas
          path: test-results
          retention-days: 7
