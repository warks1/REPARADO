name: Validar fotografías y catálogo Manitas
on:
  push:
    branches: [feat/manitas-fotografias-licencias-20261021]
    paths:
      - '.github/workflows/qa-manitas-photos.yml'
      - 'customer-ui.js'
      - 'vivid-theme.css'
      - 'public/services/handyman-*.webp'
      - 'public/creditos-fotos-manitas.html'
      - 'tests/**'
      - 'e2e/**'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Tests unitarios
        run: npm test
      - name: Compilación web
        run: npm run build
      - name: Instalar Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Validar iPhone Android y tablet
        run: npm run test:visual
      - name: Capturas de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reparado-fotos-manitas-qa
          path: test-results
          retention-days: 7
