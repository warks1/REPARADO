name: Reparado iOS simulator check
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - '*.ts'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Compilar web para iOS
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Crear proyecto iOS y sincronizar
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Compilar versión para simulador sin firma
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build
      - name: Conservar versión para simulador
        uses: actions/upload-artifact@v4
        with:
          name: Reparado-iOS-Simulador
          path: ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
