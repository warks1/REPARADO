name: REPARADO V44 · Exportar datos propios
on:
  pull_request:
    branches: [main]
    paths:
      - 'customer-data-export.js'
      - 'connected.js'
      - 'tests/customer-data-export-v44.test.mjs'
      - 'docs/EXPORTACION-DATOS-CLIENTE.md'
      - '.github/workflows/qa-data-export-v44.yml'
  push:
    branches: [main]
    paths:
      - 'customer-data-export.js'
      - 'connected.js'
      - 'tests/customer-data-export-v44.test.mjs'
      - 'docs/EXPORTACION-DATOS-CLIENTE.md'
      - '.github/workflows/qa-data-export-v44.yml'
permissions:
  contents: read
jobs:
  privacy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
