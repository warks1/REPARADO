name: REPARADO V45 · Visitas al calendario
on:
  pull_request:
    branches: [main]
    paths:
      - 'visit-calendar.js'
      - 'connected.js'
      - 'tests/visit-calendar-v45.test.mjs'
      - 'docs/AGENDA-CALENDARIO-ICS.md'
      - '.github/workflows/qa-calendar-v45.yml'
  push:
    branches: [main]
    paths:
      - 'visit-calendar.js'
      - 'connected.js'
      - 'tests/visit-calendar-v45.test.mjs'
      - 'docs/AGENDA-CALENDARIO-ICS.md'
      - '.github/workflows/qa-calendar-v45.yml'
permissions:
  contents: read
jobs:
  calendar-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
