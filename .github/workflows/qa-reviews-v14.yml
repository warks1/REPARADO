name: Validar reseñas unificadas V14
on:
  pull_request:
    branches: [main]
    paths:
      - 'reviews.js'
      - 'review-moderation.js'
      - 'connected.js'
      - 'supabase/migration-v15.sql'
      - 'tests/review-moderation.test.mjs'
      - 'tests/reviews-moderation-rls-v15.py'
      - 'customer-ui.js'
      - 'vivid-theme.css'
      - 'tests/reviews-v13.test.mjs'
      - 'e2e/reviews-unified.spec.mjs'
      - 'e2e-private/reviews-unified.spec.mjs'
      - '.github/workflows/qa-reviews-v14.yml'
  push:
    branches: [main]
    paths:
      - 'reviews.js'
      - 'review-moderation.js'
      - 'connected.js'
      - 'supabase/migration-v15.sql'
      - 'tests/review-moderation.test.mjs'
      - 'tests/reviews-moderation-rls-v15.py'
      - 'customer-ui.js'
      - 'vivid-theme.css'
      - 'tests/reviews-v13.test.mjs'
      - 'e2e/reviews-unified.spec.mjs'
      - 'e2e-private/reviews-unified.spec.mjs'
      - '.github/workflows/qa-reviews-v14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar todas las reglas y reseñas
        run: npm test
      - name: Compilar web
        run: npm run build
      - name: Preparar navegadores móviles
        run: npx playwright install --with-deps chromium webkit
      - name: Verificar interfaz local iPhone y Android
        run: npx playwright test e2e/reviews-unified.spec.mjs --project=iphone-390 --project=android-412
      - name: Verificar valoraciones reales simuladas y acceso privado
        run: npx playwright test --config playwright.invite.config.mjs e2e-private/reviews-unified.spec.mjs --project=iphone --project=android

  moderation-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Preparar cuatro identidades y RLS V4 a V11
        run: python -u tests/supabase-roles-rls.py
      - name: Comprobar RLS de reseñas V13 y moderación V15
        run: python -u tests/reviews-moderation-rls-v15.py
