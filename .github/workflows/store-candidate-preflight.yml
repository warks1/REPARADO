name: REPARADO · Comprobación previa a tiendas
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/store-preflight.mjs'
      - 'scripts/configure-android-release.mjs'
      - '.github/workflows/store-release.yml'
      - '.github/workflows/store-candidate-preflight.yml'
      - 'supabase/migration-store-account-deletion.sql'
      - 'tests/store-release.test.mjs'
      - 'tests/account-deletion-store-rls.py'
      - 'connected.js'
      - 'vivid-theme.css'
  push:
    branches: [main]
    paths:
      - 'scripts/store-preflight.mjs'
      - 'scripts/configure-android-release.mjs'
      - '.github/workflows/store-release.yml'
      - '.github/workflows/store-candidate-preflight.yml'
      - 'supabase/migration-store-account-deletion.sql'
      - 'tests/store-release.test.mjs'
      - 'tests/account-deletion-store-rls.py'
      - 'connected.js'
      - 'vivid-theme.css'
permissions:
  contents: read
jobs:
  code-and-store-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verificar rechazo de paquete sin producción
        run: |
          if node scripts/store-preflight.mjs; then
            echo 'FALLO DE SEGURIDAD: permitida versión demo en tienda'
            exit 1
          fi
  account-deletion-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Preparar cuentas ficticias y RLS
        run: python -u tests/supabase-roles-rls.py
      - name: Verificar borrado de cuentas sin permisos excesivos
        run: python -u tests/account-deletion-store-rls.py

  android-native-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Compilar y sincronizar Capacitor 8
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android --iconBackgroundColor '#fff9f5' --splashBackgroundColor '#ffffff'
      - name: Comprobar API objetivo y generar AAB de prueba NO firmado
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {androidApiLevel} from './scripts/configure-android-release.mjs'; if(androidApiLevel(readFileSync('android/variables.gradle','utf8'))!==36)process.exit(1)"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
          echo 'AAB de prueba generado. NO subir a Google Play: requiere firma y producción.'
