name: REPARADO V100 · Parte y cierre seguros del operario
on:
  pull_request:
    branches: [main]
    paths:
      - 'operator-work-service.js'
      - 'operator-work-view.js'
      - 'connected.js'
      - 'staff-work-pages.js'
      - 'supabase/migration-v100-operator-work-reports.sql'
      - 'vivid-theme.css'
      - 'tests/operator-work-v100.test.mjs'
      - 'tests/operator-work-v102.test.mjs'
      - 'tests/operator-handover-v103.test.mjs'
      - 'tests/operator-gallery-v104.test.mjs'
      - 'tests/operator-gallery-v107.test.mjs'
      - 'work-photo-recovery.js'
      - 'tests/work-photo-recovery-v108.test.mjs'
      - 'tests/operator-handover-v103.sql'
      - 'supabase/migration-v103-operator-handover.sql'
      - 'supabase/migration-v103a-guard-active-transfer.sql'
      - 'operator-work-service.js'
      - 'owner-calendar.js'
      - 'e2e-private/operator-handover-v103.spec.mjs'
      - 'tests/work-photo-quota-v102.sql'
      - 'supabase/migration-v102-work-photo-quota.sql'
      - 'e2e-private/operator-work-v100.spec.mjs'
      - '.github/workflows/qa-operator-work-v100.yml'
  push:
    branches: [main]
    paths:
      - 'operator-work-service.js'
      - 'operator-work-view.js'
      - 'connected.js'
      - 'staff-work-pages.js'
      - 'supabase/migration-v100-operator-work-reports.sql'
      - 'vivid-theme.css'
      - 'tests/operator-work-v100.test.mjs'
      - 'tests/operator-work-v102.test.mjs'
      - 'tests/operator-handover-v103.test.mjs'
      - 'tests/operator-gallery-v104.test.mjs'
      - 'tests/operator-gallery-v107.test.mjs'
      - 'work-photo-recovery.js'
      - 'tests/work-photo-recovery-v108.test.mjs'
      - 'tests/operator-handover-v103.sql'
      - 'supabase/migration-v103-operator-handover.sql'
      - 'supabase/migration-v103a-guard-active-transfer.sql'
      - 'operator-work-service.js'
      - 'owner-calendar.js'
      - 'e2e-private/operator-handover-v103.spec.mjs'
      - 'tests/work-photo-quota-v102.sql'
      - 'supabase/migration-v102-work-photo-quota.sql'
      - 'e2e-private/operator-work-v100.spec.mjs'
      - '.github/workflows/qa-operator-work-v100.yml'
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Pruebas de seguridad del operario y galerías
        run: node --test tests/operator-work-v100.test.mjs tests/operator-work-v102.test.mjs tests/operator-handover-v103.test.mjs tests/operator-gallery-v104.test.mjs tests/operator-gallery-v107.test.mjs tests/work-photo-recovery-v108.test.mjs
      - name: Compilación completa
        run: npm run build
  operator-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Prueba de parte en iPhone y Android simulados
        run: npx playwright test --config playwright.invite.config.mjs e2e-private/operator-work-v100.spec.mjs e2e-private/operator-handover-v103.spec.mjs --project=iphone --project=android
      - name: Guardar evidencias si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reparado-v100-work-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
