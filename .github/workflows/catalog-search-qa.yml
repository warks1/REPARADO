name: Validar buscador y categorias Reparado
on:
  push:
    branches: [fix/catalogo-ver-todos-y-busqueda-20261021]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Pruebas unitarias
        run: npm test
      - name: Compilacion Vite
        run: npm run build
      - name: Navegadores
        run: npx playwright install --with-deps chromium webkit
      - name: Comprobar movil iPhone Android Safari tablet
        run: npm run test:visual
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-buscador-y-categorias
          path: test-results
          retention-days: 7
