name: Revisar recorte Parquet y Reformas
on:
  push:
    branches: [fix/parquet-reformas-recorte-20261021]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Probar cuatro tamaños móviles/tablet y captura de categorías
        run: npm run test:visual
