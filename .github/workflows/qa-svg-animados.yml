name: Reparado validar SVG animados
on:
  push:
    branches: [fix/ilustraciones-vectoriales-animadas-20261021]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar reglas y componentes
        run: npm test
      - name: Compilar web
        run: npm run build
      - name: Instalar navegadores Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Probar tarjetas, animación y navegación en móvil y tablet
        run: npm run test:visual
      - name: Guardar capturas visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reparado-svg-animaciones
          path: test-results
          if-no-files-found: warn
          retention-days: 7
