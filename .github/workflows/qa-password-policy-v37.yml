name: REPARADO V37 · Seguridad de contraseñas nuevas
on:
  pull_request:
    branches: [main]
    paths:
      - 'password-policy.js'
      - 'connected.js'
      - 'tests/password-policy-v37.test.mjs'
      - '.github/workflows/qa-password-policy-v37.yml'
  push:
    branches: [main]
    paths:
      - 'password-policy.js'
      - 'connected.js'
      - 'tests/password-policy-v37.test.mjs'
      - '.github/workflows/qa-password-policy-v37.yml'
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
