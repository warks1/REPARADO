name: Validar concurrencia agenda PostgreSQL V7
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migration-v7.sql'
      - 'tests/schedule-db-concurrency.py'
      - 'connected.js'
      - 'tests/staff-interface.test.mjs'
      - '.github/workflows/qa-atomic-agenda-v7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migration-v7.sql'
      - 'tests/schedule-db-concurrency.py'
      - 'connected.js'
      - 'tests/staff-interface.test.mjs'
      - '.github/workflows/qa-atomic-agenda-v7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar driver PostgreSQL
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Test transaccional de dos administradores
        run: python -u tests/schedule-db-concurrency.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reparado-v7-regresion-visual
          path: test-results
          retention-days: 7
