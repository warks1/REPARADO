name: Preparar fotografías libres de Manitas
on:
  push:
    branches: [feat/manitas-fotografias-licencias-20261021]
    paths:
      - '.github/workflows/download-manitas-photos.yml'
      - 'scripts/download-manitas-photos.py'
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Instalar conversor de imágenes
        run: pip install --disable-pip-version-check pillow
      - name: Descargar con validación de autor y licencia
        run: python -u scripts/download-manitas-photos.py
      - name: Guardar fotos y atribuciones
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/services/handyman-*.webp public/creditos-fotos-manitas.html docs/manitas-foto-creditos.json
          git diff --cached --quiet || git commit -m "Incorporar doce fotos de Manitas con atribución de sus autores"
          git push
