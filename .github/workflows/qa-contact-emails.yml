name: REPARADO · Contactos y avisos por correo
on:
  pull_request:
    branches: [main]
    paths:
      - 'contact-emails.js'
      - 'connected.js'
      - 'local-preview.js'
      - 'vivid-theme.css'
      - 'supabase/migration-request-email-outbox.sql'
      - 'supabase/functions/reparado-mail-worker/**'
      - 'tests/contact-emails.test.mjs'
      - 'tests/request-email-outbox-rls.py'
      - '.github/workflows/qa-contact-emails.yml'
  push:
    branches: [main]
    paths:
      - 'contact-emails.js'
      - 'connected.js'
      - 'local-preview.js'
      - 'vivid-theme.css'
      - 'supabase/migration-request-email-outbox.sql'
      - 'supabase/functions/reparado-mail-worker/**'
      - 'tests/contact-emails.test.mjs'
      - 'tests/request-email-outbox-rls.py'
      - '.github/workflows/qa-contact-emails.yml'
permissions:
  contents: read
jobs:
  web-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar seguridad y configuración
        run: npm test
      - name: Compilar interfaz
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar TypeScript del worker sin credenciales
        run: deno check supabase/functions/reparado-mail-worker/index.ts

  email-private-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reparado_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reparado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPARADO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reparado_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Preparar datos ficticios y roles con RLS
        run: python -u tests/supabase-roles-rls.py
      - name: Verificar privacidad y deduplicación de avisos
        run: python -u tests/request-email-outbox-rls.py
