name: Validar iconos originales animados
on:
  push:
    branches: [fix/recuperar-iconos-originales-20261021]
    paths:
      - '.github/workflows/verify-restored-art.yml'
      - 'customer-ui.js'
      - 'vivid-theme.css'
      - 'e2e/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Tests unitarios
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Navegadores
        run: npx playwright install --with-deps chromium webkit
      - name: Pruebas móviles y visuales
        run: npm run test:visual
      - name: Conservar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iconos-originales-qa
          path: test-results
          retention-days: 7
