<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Reparado" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="description" content="Reparado: solicita servicios de reparación de forma sencilla." />
  <title>Reparado — Servicios de reparación</title>
</head>
<body>
  <div id="app"><div class="startup">🛠️<p>Iniciando Reparado…</p></div></div>
  <script>
  // Independiente de los módulos: si falla el arranque, nunca dejar pantalla blanca.
  (function () {
    var initialized = false, shown = false;
    function hasContent() {
      var root = document.querySelector('#app');
      var main = root && root.querySelector('main');
      return !!(main && main.textContent && main.textContent.trim().length > 15);
    }
    function recover() {
      if (shown || initialized || hasContent()) return;
      shown = true;
      var root = document.querySelector('#app');
      if (!root) return;
      root.innerHTML = '<main role="alert" style="font-family:system-ui,-apple-system,sans-serif;min-height:75dvh;padding:32px 22px;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:auto;color:#102143;background:#fff"><div style="font-size:48px;color:#ff6127">⌂</div><h1 style="font-size:26px;margin:12px 0">No hemos podido abrir Reparado</h1><p style="line-height:1.6;color:#52627b">Se ha interrumpido la carga. Puedes volver a intentarlo sin perder tus solicitudes guardadas.</p><button id="reparado-retry" type="button" style="background:#ff6127;color:white;border:0;border-radius:14px;padding:16px;font-weight:700;cursor:pointer">Volver a intentar</button></main>';
      var retry = document.querySelector('#reparado-retry');
      if (retry) retry.addEventListener('click', function () { location.reload(); });
    }
    window.__reparadoBoot = {
      ready: function () { initialized = true; },
      fail: recover
    };
    window.addEventListener('error', function (event) {
      if (initialized) return;
      var source = event.target;
      if (source && source.tagName === 'SCRIPT') recover();
      else if (!source || source === window) setTimeout(recover, 0);
    }, true);
    window.addEventListener('unhandledrejection', function () {
      if (!initialized) setTimeout(recover, 0);
    });
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () { if (!initialized) recover(); }, 9000);
    });
  }());
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
