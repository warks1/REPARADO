<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 260" role="img" aria-labelledby="title desc">
<title id="title">Electricidad</title>
<desc id="desc">Cuadro eléctrico azul y rayo dorado brillante sobre fondo transparente</desc>
<defs>
<linearGradient id="outlet" x1="0" x2="1" y1="0" y2="1">
 <stop offset="0" stop-color="#dcfaff"/><stop offset=".39" stop-color="#79d4fa"/>
 <stop offset="1" stop-color="#3994e0"/></linearGradient>
<linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
 <stop stop-color="#0a4b9a"/><stop offset=".5" stop-color="#337bc4"/>
 <stop offset="1" stop-color="#073674"/></linearGradient>
<linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
 <stop stop-color="#fff"/><stop offset="1" stop-color="#e0f6ff"/></linearGradient>
<linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
 <stop stop-color="#fff7a8"/><stop offset=".32" stop-color="#ffe546"/>
 <stop offset=".67" stop-color="#ffc52c"/><stop offset="1" stop-color="#f69519"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
 <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1762a5" flood-opacity=".24"/>
</filter>
<filter id="spark-shadow" x="-40%" y="-40%" width="180%" height="180%">
 <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#c67504" flood-opacity=".27"/>
</filter>
</defs>
<g opacity=".7"><circle cx="351" cy="65" r="17" fill="#fff9e9"/>
<circle cx="71" cy="199" r="12" fill="#ffe468"/>
<circle cx="103" cy="44" r="6" fill="#eefeff"/></g>
<g filter="url(#shadow)">
 <rect x="119" y="20" width="208" height="219" rx="37" fill="url(#frame)"/>
 <rect x="128" y="29" width="190" height="201" rx="29" fill="url(#outlet)"/>
 <path d="M150 49c23-18 56-19 108-15" fill="none" stroke="#fff" stroke-width="8" opacity=".45" stroke-linecap="round"/>
 <rect x="147" y="61" width="152" height="83" rx="17" fill="#4b96d0" opacity=".66"/>
 <rect x="154" y="67" width="138" height="71" rx="14" fill="url(#glass)" stroke="#5793c8" stroke-width="4"/>
 <g fill="none" stroke="#1b5c9e" stroke-linecap="round" stroke-width="10">
  <path d="M191 87v29M222 87v29M252 87v29"/>
 </g>
